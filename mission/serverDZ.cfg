// serverDZ.cfg template for an Aotearoa server. Start the server with -mod=@Aotearoa
// (and the same mod on clients), and put dayzOffline.aotearoa in the server's mpmissions folder.
hostname = "Aotearoa";
password = "";
passwordAdmin = "CHANGE_ME";
description = "A 20 km New Zealand terrain";
maxPlayers = 60;
verifySignatures = 2;
forceSameBuild = 1;
disableVoN = 0;
vonCodecQuality = 20;
disable3rdPerson = 0;
disableCrosshair = 0;
disablePersonalLight = 1;
lightingConfig = 0;
serverTime = "SystemTime";
serverTimeAcceleration = 4;
serverNightTimeAcceleration = 8;
serverTimePersistent = 0;
guaranteedUpdates = 1;
loginQueueConcurrentPlayers = 5;
loginQueueMaxPlayers = 500;
instanceId = 1;
storageAutoFix = 1;
enableCfgGameplayFile = 1;

class Missions
{
	class DayZ
	{
		template = "dayzOffline.aotearoa";
	};
};
